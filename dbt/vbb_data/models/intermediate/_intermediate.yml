models:
  - name: int_departures_last
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trip_id
              - stop_id
    columns:
      - name: trip_id
        data_tests:
          - not_null
      - name: stop_id
        data_tests:
          - not_null
      - name: last_fetched_at
        data_tests:
          - not_null
      - name: planned_when
        data_tests:
          - not_null