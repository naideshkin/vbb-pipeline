models:
  - name: stg_departures
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trip_id
              - stop_id
              - fetched_at
    columns:
      - name: queried_stop_id
        data_tests:
          - not_null
      - name: trip_id
        data_tests:
          - not_null
      - name: stop_id
        data_tests:
          - not_null
      - name: fetched_at
        data_tests:
          - not_null
      - name: planned_when
        data_tests:
          - not_null
      - name: line_product
        data_tests:
          - accepted_values:
                arguments:
                  values: ['bus', 'subway', 'tram', 'suburban']