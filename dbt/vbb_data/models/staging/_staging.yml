models:
  - name: stg_departures
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trip_id
              - stop_id
              - fetched_at
    columns:
      - name: trip_id
        data_tests:
          - not_null
      - name: stop_id
        data_tests:
          - not_null
      - name: fetched_at
        data_tests:
          - not_null
      - name: planned_when
        data_tests:
          - not_null