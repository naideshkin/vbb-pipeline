services:
  seaweedfs:                        # a name we choose for this service
    image: chrislusf/seaweedfs      # which image to run
    container_name: seaweedfs
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data  # start all parts + the S3 API, store data in /data
    ports:
      - "127.0.0.1:8333:8333"                 # laptop port : container port (S3 API)
    volumes:
      - seaweedfs_data:/data        # keep /data even if the container is removed
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro  # read-only config file

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: clickhouse
    ports:
      - "127.0.0.1:8123:8123"                 # HTTP interface
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    volumes:
      - clickhouse_data:/var/lib/clickhouse  # persist data
      - ./infra/clickhouse/users.d/admin.xml:/etc/clickhouse-server/users.d/admin.xml:ro
volumes:
  seaweedfs_data:                   # Docker creates and manages this storage
  clickhouse_data:                  # Docker creates and manages this storage

include:
  - airflow/docker-compose.yaml